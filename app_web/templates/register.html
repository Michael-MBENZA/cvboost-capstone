{% extends "base.html" %}

{% block title %}Inscription{% endblock %}

{% block content %}
<section class="card form-card">
    <h1>Créer un compte</h1>
    <form method="POST">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" required value="{{ request.form.username }}">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required value="{{ request.form.email }}">

        <label for="password">Mot de passe (8 caractères minimum)</label>
        <input type="password" id="password" name="password" required minlength="8">

        <label for="confirm">Confirmer le mot de passe</label>
        <input type="password" id="confirm" name="confirm" required minlength="8">

        <button type="submit" class="btn">S'inscrire</button>
    </form>
    <p>Déjà inscrit ? <a href="{{ url_for('main.login') }}">Se connecter</a></p>
</section>
{% endblock %}
