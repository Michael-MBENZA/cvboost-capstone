{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <section class="card auth-card">
        <h1>Connexion</h1>
        <p class="subtitle">Heureux de vous revoir ! Connectez-vous à votre espace candidat.</p>

        <form method="POST">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" required value="{{ request.form.email }}" placeholder="nom@exemple.cd">

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <label class="checkbox">
                <input type="checkbox" name="remember"> Se souvenir de moi
            </label>

            <button type="submit" class="btn btn-block">Se connecter</button>
        </form>
        <p class="switch">Nouveau sur CVBoost ? <a href="{{ url_for('main.register') }}">Créer un compte</a></p>
    </section>
</div>
{% endblock %}
