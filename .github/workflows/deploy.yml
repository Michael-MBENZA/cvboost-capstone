# Pipeline CI/CD de CVBoost (GitHub Actions)
# À chaque push ou pull request sur main :
#   1. tests      : installe les dépendances et lance pytest
#   2. images     : construit les images Docker du site et de l'API (seulement si les tests passent)
#   3. (à venir)  : déploiement sur Azure

name: CI/CD CVBoost

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest            # un serveur Linux fourni gratuitement par GitHub
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip                  # garde les paquets téléchargés d'une exécution à l'autre

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -q      # OpenAI et la voix sont simulés : aucune clé nécessaire

  images:
    name: Construction des images Docker
    needs: tests                      # ne démarre que si les tests ont réussi
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image du site (cible web)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: cvboost-web:ci
          push: false                 # on vérifie seulement que l'image se construit
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Image de l'API (cible api)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: cvboost-api:ci
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
